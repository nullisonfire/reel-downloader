<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finstabook | Premium Reel Downloader</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <!-- Aurora & Particles Background -->
    <div class="aurora-bg"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- Processing Overlay (New) -->
    <div id="processing-overlay" class="hidden">
        <div class="overlay-content">
            <div class="spinner large"></div>
            <h2 class="gradient-text">Processing Media</h2>
            <p>Merging separate video and audio streams... This might take a few seconds based on file size and browser speed.</p>
        </div>
    </div>

    <main class="container">
        <header>
            <h1 class="gradient-text">Finstabook</h1>
            <p>Facebook & Instagram Video Downloader</p>
        </header>

        <section class="search-section glass-panel">
            <div class="input-group">
                <input type="text" id="url-input" placeholder="Paste Reel or Video URL here..." autocomplete="off">
                <button id="fetch-btn" class="ripple-btn">
                    <span class="btn-text">Fetch Video</span>
                    <div class="spinner hidden"></div>
                </button>
            </div>
        </section>

        <!-- Result Container -->
        <section id="result-container" class="hidden fade-in">
            <div class="result-card glass-panel tilt-element">
                <div class="video-preview">
                    <!-- Standard placeholder poster -->
                    <video id="preview-video" controls poster="assets/favicon.svg"></video>
                    <!-- HIDDEN Synced Audio Element (New) -->
                    <audio id="synced-audio"></audio>
                </div>
                
                <div class="media-details">
                    <div class="author-info">
                        <img id="author-pic" src="" alt="Author">
                        <div class="author-text">
                            <h3 id="author-name"></h3>
                            <p id="author-username"></p>
                        </div>
                    </div>
                    
                    <p id="caption" class="caption-text"></p>
                    
                    <div class="stats">
                        <div class="stat"><span id="like-count">0</span> Likes</div>
                        <div class="stat"><span id="comment-count">0</span> views</div>
                    </div>

                    <!-- Updated action-buttons container (New style for column layout) -->
                    <div class="action-buttons-container">
                        <!-- Standard copy btn -->
                        <button id="copy-link-btn" class="ripple-btn secondary-btn" style="margin-bottom: 0.5rem;">Copy Main Link</button>
                        <!-- Title for dynamic section -->
                        <h4 style="color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.9rem;">Available Qualities:</h4>
                        <!-- Container where dynamic download buttons will be inserted -->
                        <div id="download-buttons-container" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-container"></div>

    <!-- External FFmpeg script -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.min.js"></script>

    <!-- Consolidated/Merged Scripts (Requested modification) -->
    <script src="js/effects_and_ui.js"></script>
    <script src="js/muxer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
